<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hailee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #040507;
    overflow: hidden;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #040507;
  }

  .sway, .head-sway {
    transform-origin: 0px 0px;
  }

  @keyframes tulip-sway {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(var(--sb)); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(var(--sa)); }
    100% { transform: rotate(0deg); }
  }

  .leaf-anim {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 0% 100%;
    transform: scale(0.05);
  }

  .head-bloom {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: scale(0.30, 0.42);
  }

  .head-front {
    opacity: 0;
  }

  .contact-shadow {
    opacity: 0;
  }

  .pollen {
    opacity: 0;
  }

  @keyframes pollen-drift {
    0%   { transform: translate(0px, 0px); }
    50%  { transform: translate(var(--dx), var(--dy)); }
    100% { transform: translate(0px, 0px); }
  }

  .hand-idle {
    transform-origin: 0px 0px;
    animation: hand-idle 1.4s ease-in-out 1000ms infinite alternate;
  }
  @keyframes hand-idle {
    0%   { transform: rotate(-1.5deg); }
    100% { transform: rotate(1.5deg); }
  }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"></svg>

<script>
(function () {
  "use strict";
  var svgNS = "http://www.w3.org/2000/svg";
  var scene = document.getElementById("scene");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function el(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---------- ground surface (single, barely-curved plane) ----------
  function groundY(x) { var t = (x + 60) / 920; return 492 - 48 * t * (1 - t); }

  // ---------- palette (each entry: main / top / light / dark) ----------
  var palette = [
    { main: "#FF4D5E", top: "#FF7D5A", light: "#FF9E8C", dark: "#C9293F" }, // red
    { main: "#FF8A3D", top: "#FFBE4E", light: "#FFD489", dark: "#D65E1E" }, // orange
    { main: "#FFC93C", top: "#FFE97F", light: "#FFF3AE", dark: "#DE9C16" }, // yellow
    { main: "#FF6FA5", top: "#FF9ECB", light: "#FFC2DD", dark: "#D4457F" }, // pink
    { main: "#A76CFF", top: "#CF8CFF", light: "#E0B4FF", dark: "#7B41D6" }, // purple
    { main: "#FFF1E0", top: "#FFFFFF", light: "#FFFFFF", dark: "#DCC3A8" }  // cream
  ];
  var CREAM_IDX = 5;
  var STEM_COLOR = "#2FA85C";
  var LEAF_COLOR = "#35BE68";
  var LEAF_HI_COLOR = "#4FD683";
  var ATMOS = "#16202A";

  // blend hex toward toHex by amt (0..1), returns "#rrggbb"
  function mix(hex, toHex, amt) {
    function h2rgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function ch(n) { var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length < 2 ? "0" + s : s; }
    var a = h2rgb(hex), b = h2rgb(toHex);
    var r = a[0] + (b[0] - a[0]) * amt;
    var g = a[1] + (b[1] - a[1]) * amt;
    var bch = a[2] + (b[2] - a[2]) * amt;
    return "#" + ch(r) + ch(g) + ch(bch);
  }

  function dimColor(c) {
    return {
      main: mix(c.main, ATMOS, 0.30),
      top: mix(c.top, ATMOS, 0.30),
      light: mix(c.light, ATMOS, 0.30),
      dark: mix(c.dark, ATMOS, 0.30)
    };
  }

  var FRONT_GREENS = { stem: STEM_COLOR, leaf: LEAF_COLOR, leafHi: LEAF_HI_COLOR };
  var BACK_GREENS = {
    stem: mix(STEM_COLOR, ATMOS, 0.30),
    leaf: mix(LEAF_COLOR, ATMOS, 0.30),
    leafHi: mix(LEAF_HI_COLOR, ATMOS, 0.30)
  };

  // ---------- hue assignment across the whole cluster ----------
  // slots: [{row, x}] in final (jittered) x order. Returns array of palette indices.
  function assignHues(slots) {
    var n = slots.length;
    var adj = [];
    for (var i = 0; i < n; i++) adj.push([]);
    function link(i, j) { adj[i].push(j); adj[j].push(i); }

    ["back", "front"].forEach(function (row) {
      var idxs = [];
      for (var i = 0; i < n; i++) if (slots[i].row === row) idxs.push(i);
      idxs.sort(function (a, b) { return slots[a].x - slots[b].x; });
      for (var k = 0; k < idxs.length - 1; k++) link(idxs[k], idxs[k + 1]);
    });
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        if (i === j || slots[i].row === slots[j].row) continue;
        if (Math.abs(slots[i].x - slots[j].x) < 45) link(i, j);
      }
    }

    function tryOnce(strict) {
      var hue = new Array(n).fill(-1);
      var counts = new Array(palette.length).fill(0);
      var order = [];
      for (var i = 0; i < n; i++) order.push(i);
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
      }
      for (var oi = 0; oi < order.length; oi++) {
        var s = order[oi];
        var cands = [];
        for (var h = 0; h < palette.length; h++) {
          if (counts[h] >= 2) continue;
          var conflict = false;
          for (var k = 0; k < adj[s].length; k++) { if (hue[adj[s][k]] === h) { conflict = true; break; } }
          if (conflict) continue;
          cands.push(h);
        }
        if (cands.length === 0) return null;
        var pick = cands[Math.floor(Math.random() * cands.length)];
        hue[s] = pick;
        counts[pick]++;
      }
      if (strict) {
        var distinct = counts.filter(function (c) { return c > 0; }).length;
        if (distinct < 5) return null;
        if (counts[CREAM_IDX] < 1 || counts[CREAM_IDX] > 2) return null;
        var creamInFront = false;
        for (var i = 0; i < n; i++) if (hue[i] === CREAM_IDX && slots[i].row === "front") creamInFront = true;
        if (!creamInFront) return null;
      } else {
        if (counts[CREAM_IDX] < 1 || counts[CREAM_IDX] > 2) return null;
      }
      return hue;
    }

    for (var attempt = 0; attempt < 4000; attempt++) {
      var res = tryOnce(true);
      if (res) return res;
    }
    for (var attempt2 = 0; attempt2 < 4000; attempt2++) {
      var res2 = tryOnce(false);
      if (res2) return res2;
    }
    // last-resort fallback: adjacency + cap only (should not be reached in practice)
    for (var attempt3 = 0; attempt3 < 4000; attempt3++) {
      var hue3 = new Array(n).fill(-1);
      var counts3 = new Array(palette.length).fill(0);
      var ok = true;
      for (var i = 0; i < n; i++) {
        var cands3 = [];
        for (var h = 0; h < palette.length; h++) {
          if (counts3[h] >= 2) continue;
          var conflict3 = false;
          for (var k = 0; k < adj[i].length; k++) { if (hue3[adj[i][k]] === h) { conflict3 = true; break; } }
          if (!conflict3) cands3.push(h);
        }
        if (cands3.length === 0) { ok = false; break; }
        var pick3 = cands3[Math.floor(Math.random() * cands3.length)];
        hue3[i] = pick3;
        counts3[pick3]++;
      }
      if (ok) return hue3;
    }
    return null;
  }

  // ---------- gradient defs (one linearGradient per tulip, hue-shifted) ----------
  var gradDefs = el("defs", {});
  scene.appendChild(gradDefs);
  var gradCounter = 0;
  function buildGradient(color) {
    var id = "grad" + (gradCounter++);
    var g = el("linearGradient", { id: id, x1: "100%", y1: "100%", x2: "0%", y2: "0%" });
    g.appendChild(el("stop", { offset: "0%", "stop-color": color.main }));
    g.appendChild(el("stop", { offset: "100%", "stop-color": color.top }));
    gradDefs.appendChild(g);
    return id;
  }
  var clipCounter = 0;
  // clips the occlusion shade to the actual head silhouette so it can never spill past the edge
  function buildHeadClip(cw, ch) {
    var id = "headclip" + (clipCounter++);
    var cp = el("clipPath", { id: id });
    cp.appendChild(el("path", { d: headBaseD(cw, ch) }));
    gradDefs.appendChild(cp);
    return id;
  }

  // 1. ground (single layer, barely curved) + crest line
  scene.appendChild(el("path", {
    d: "M -60,492 Q 400,468 860,492 L 860,520 L -60,520 Z",
    fill: "#1A3A26"
  }));
  scene.appendChild(el("path", {
    d: "M -60,492 Q 400,468 860,492",
    stroke: "#23492F",
    "stroke-width": "3",
    fill: "none"
  }));

  // 2. back row group (holds back tulips, dimmer for depth)
  var backRow = el("g", { "class": "back-row" });
  scene.appendChild(backRow);

  // 3. front row group
  var frontRow = el("g", {});
  scene.appendChild(frontRow);

  // 4. pollen group
  var pollenGroup = el("g", {});
  scene.appendChild(pollenGroup);

  // 5. hand group (appended now to lock in z-order; populated after plant timings are known)
  var handGroup = el("g", {});
  if (!reduced) scene.appendChild(handGroup);

  // ---------- shape helpers ----------
  // broad, short, curling blade (bbox x:0..~41, y:-100..0; bottom-left is the attach point)
  var LEAF_D = "M0,0 C 14,-22 34,-46 40,-74 C 43,-88 38,-98 30,-100 C 30,-76 18,-40 0,-12 Z";
  var LEAF_NATURAL_LEN = 100;

  // seed: almond/teardrop, origin at its landing point
  var SEED_BASE_D = "M 0,-1 C -4.6,-1 -6,-5.4 -3.4,-9.2 C -1.8,-11.4 1.8,-11.4 3.4,-9.2 C 6,-5.4 4.6,-1 0,-1 Z";
  var SEED_LIT_D = "M -3.0,-3.0 C -4.4,-6.0 -2.8,-9.4 -0.6,-10.4 C -2.0,-8.2 -2.6,-5.4 -3.0,-3.0 Z";

  // hand + forearm: one silhouette, origin at the pinch point, arm extending up off-frame
  var HAND_D = "M 0,0 C -5,-4 -9,-10 -10,-16 C -13,-22 -14,-30 -12,-38 C -11,-46 -13,-52 -13,-60 L -13,-300 L 15,-300 L 15,-60 C 15,-52 20,-44 19,-36 C 18,-26 14,-16 8,-8 C 5,-4 2,-1 0,0 Z";
  var HAND_SHADOW_D = "M 8,-8 C 14,-16 18,-26 19,-36 C 20,-44 15,-52 15,-60 L 15,-300 L 4,-300 L 4,-60 C 4,-50 8,-40 7,-30 C 6,-20 3,-10 0,0 C 3,-2 6,-5 8,-8 Z";

  // one-silhouette tulip head: base ovoid with three lobes, plus carved internal shapes
  function headBaseD(cw, ch) {
    return "M 0,0 " +
      "C " + (-cw * 0.95) + "," + (-ch * 0.10) + " " + (-cw) + "," + (-ch * 0.45) + " " + (-cw * 0.86) + "," + (-ch * 0.72) + " " +
      "C " + (-cw * 0.80) + "," + (-ch * 0.95) + " " + (-cw * 0.50) + "," + (-ch * 1.02) + " " + (-cw * 0.42) + "," + (-ch * 0.80) + " " +
      "C " + (-cw * 0.30) + "," + (-ch * 1.00) + " " + (-cw * 0.14) + "," + (-ch * 1.06) + " 0," + (-ch * 1.08) + " " +
      "C " + (cw * 0.14) + "," + (-ch * 1.06) + " " + (cw * 0.30) + "," + (-ch * 1.00) + " " + (cw * 0.42) + "," + (-ch * 0.80) + " " +
      "C " + (cw * 0.50) + "," + (-ch * 1.02) + " " + (cw * 0.80) + "," + (-ch * 0.95) + " " + (cw * 0.86) + "," + (-ch * 0.72) + " " +
      "C " + cw + "," + (-ch * 0.45) + " " + (cw * 0.95) + "," + (-ch * 0.10) + " 0,0 Z";
  }
  function headShadowD(cw, ch) {
    return "M 0,0 " +
      "C " + (cw * 0.95) + "," + (-ch * 0.10) + " " + cw + "," + (-ch * 0.45) + " " + (cw * 0.86) + "," + (-ch * 0.72) + " " +
      "C " + (cw * 0.60) + "," + (-ch * 0.86) + " " + (cw * 0.30) + "," + (-ch * 0.70) + " " + (cw * 0.34) + "," + (-ch * 0.40) + " " +
      "C " + (cw * 0.36) + "," + (-ch * 0.20) + " " + (cw * 0.20) + "," + (-ch * 0.06) + " 0,0 Z";
  }
  function headFrontD(cw, ch) {
    return "M 0,0 " +
      "C " + (-cw * 0.52) + "," + (-ch * 0.14) + " " + (-cw * 0.56) + "," + (-ch * 0.60) + " " + (-cw * 0.30) + "," + (-ch * 0.88) + " " +
      "C " + (-cw * 0.16) + "," + (-ch * 1.00) + " " + (cw * 0.16) + "," + (-ch * 1.00) + " " + (cw * 0.30) + "," + (-ch * 0.88) + " " +
      "C " + (cw * 0.56) + "," + (-ch * 0.60) + " " + (cw * 0.52) + "," + (-ch * 0.14) + " 0,0 Z";
  }

  // ---------- build one tulip ----------
  function buildTulip(spec, rowGroup) {
    var x = spec.x, y = spec.y, s = spec.scale, H = spec.H, color = spec.color, greens = spec.greens;

    var g = el("g", { transform: "translate(" + x + "," + y + ") scale(" + s + ")" });
    rowGroup.appendChild(g);

    // contact shadow (drawn behind everything else belonging to this plant)
    var shadow = el("ellipse", { cx: "0", cy: "0", rx: "9", ry: "2.4", fill: "#0A1A10", "class": "contact-shadow" });
    g.appendChild(shadow);

    // seed (static placement group; motion applied via inline style / WAAPI)
    var seedG = el("g", { "class": "seed" });
    seedG.appendChild(el("path", { d: SEED_BASE_D, fill: "#B87A42" }));
    seedG.appendChild(el("path", { d: SEED_LIT_D, fill: "#D9A163" }));
    seedG.appendChild(el("ellipse", { cx: "-1.4", cy: "-7.6", rx: "0.9", ry: "1.3", fill: "#FFE3C0", opacity: "0.65" }));
    g.appendChild(seedG);

    // impact puff (built later at land time via a lazily-created group)
    var puffG = el("g", {});
    g.appendChild(puffG);

    // sway wrapper
    var sway = el("g", { "class": "sway" });
    g.appendChild(sway);

    // stem
    var tipX = rand(-14, 14);
    var b = rand(-16, 16);
    var stemD = "M0,0 C " + b + "," + (-H * 0.30) + " " + (-b * 0.6) + "," + (-H * 0.62) + " " + tipX + "," + (-H);
    var stem = el("path", {
      d: stemD,
      fill: "none",
      stroke: greens.stem,
      "stroke-width": "5.5",
      "stroke-linecap": "round"
    });
    sway.appendChild(stem);

    // thin lighter highlight riding on top of the stem, same curve, offset slightly (light from upper-left)
    var stemHi = el("path", {
      d: stemD,
      fill: "none",
      stroke: greens.leafHi,
      "stroke-width": "2.2",
      "stroke-linecap": "round",
      transform: "translate(-1.6,0)"
    });
    sway.appendChild(stemHi);

    // measure the real curve now that it's in the live document
    var L = stem.getTotalLength();
    var pA = stem.getPointAtLength(0.10 * L);
    var pB = stem.getPointAtLength(0.30 * L);
    var pTip = stem.getPointAtLength(L);

    // fewer, broader leaves: front row gets 2, back row gets 1
    var leafCount = spec.row === "back" ? 1 : 2;
    var fracA = rand(0.55, 0.70);
    var fracB = rand(0.55, 0.70);
    if (leafCount === 2 && Math.abs(fracA - fracB) < 0.05) fracB = fracA > 0.625 ? fracA - 0.08 : fracA + 0.08;

    function buildLeaf(pt, mirror, frac) {
      var rot = rand(2, 9);
      var factor = (H * frac * 0.85) / LEAF_NATURAL_LEN;
      var wrap = el("g", {
        transform: "translate(" + pt.x + "," + pt.y + ") scale(" + (mirror * factor) + "," + factor + ") rotate(" + rot + ")"
      });
      var anim = el("g", { "class": "leaf-anim" });
      anim.appendChild(el("path", { d: LEAF_D, fill: greens.leaf }));
      wrap.appendChild(anim);
      sway.appendChild(wrap);
      return anim;
    }
    var backLeafMirror = Math.random() < 0.5 ? 1 : -1;
    var leafA = buildLeaf(pA, leafCount === 1 ? backLeafMirror : 1, fracA);
    var leafB = leafCount === 2 ? buildLeaf(pB, -1, fracB) : null;

    // head: static tip placement -> infinite lag sway -> one-shot bloom scale/opacity -> carved silhouette
    var head = el("g", { transform: "translate(" + pTip.x + "," + pTip.y + ")" });
    var headSway = el("g", { "class": "head-sway" });
    head.appendChild(headSway);
    sway.appendChild(head);

    var headBloom = el("g", { "class": "head-bloom" });
    headSway.appendChild(headBloom);

    var cw = 26 * (1 + rand(-0.08, 0.08));
    var ch = 60 * (1 + rand(-0.08, 0.08));
    var gradId = buildGradient(color);
    var headClipId = buildHeadClip(cw, ch);

    var headBase = el("path", { d: headBaseD(cw, ch), fill: "url(#" + gradId + ")" });
    var headShadow = el("path", { d: headShadowD(cw, ch), fill: color.dark, opacity: "0.85" });
    // occlusion: small dark ellipse clipped to the silhouette so it can never spill past the base
    var headOcclusion = el("ellipse", {
      cx: "0", cy: String(-ch * 0.07), rx: String(cw * 0.28), ry: String(ch * 0.035),
      fill: color.dark, opacity: "0.45", "clip-path": "url(#" + headClipId + ")"
    });
    var headFront = el("path", { d: headFrontD(cw, ch), fill: color.main, "class": "head-front" });
    headBloom.appendChild(headBase);
    headBloom.appendChild(headShadow);
    headBloom.appendChild(headOcclusion);
    headBloom.appendChild(headFront);

    return {
      g: g, shadow: shadow, seedG: seedG, puffG: puffG, stem: stem, stemHi: stemHi, L: L,
      leafA: leafA, leafB: leafB,
      headBloom: headBloom, headFront: headFront,
      swayEl: sway, headSwayEl: headSway,
      scale: s, plantY: y
    };
  }

  // ---------- hand that drops the seeds ----------
  function buildHand(container) {
    var motion = el("g", {});
    motion.style.transform = "translateY(-320px)";

    var root = el("g", { transform: "translate(400,150)" });
    var idle = el("g", { "class": "hand-idle" });

    idle.appendChild(el("path", { d: HAND_D, fill: "#E8B08A" }));
    idle.appendChild(el("path", { d: HAND_SHADOW_D, fill: "#C98C68", opacity: "0.9" }));

    var cuffClip = el("clipPath", { id: "cuffclip" });
    cuffClip.appendChild(el("rect", { x: "-15", y: "-108", width: "32", height: "32", rx: "6" }));
    gradDefs.appendChild(cuffClip);

    idle.appendChild(el("rect", { x: "-15", y: "-108", width: "32", height: "32", rx: "6", fill: "#3D6E8C" }));
    idle.appendChild(el("rect", {
      x: String(17 - 32 / 3), y: "-108", width: String(32 / 3), height: "32",
      fill: "#2E5670", "clip-path": "url(#cuffclip)"
    }));

    root.appendChild(idle);
    motion.appendChild(root);
    container.appendChild(motion);

    motion.animate([
      { transform: "translateY(-320px)" },
      { transform: "translateY(0px)" }
    ], { duration: 1000, delay: 0, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });

    return { motion: motion, idle: idle };
  }

  // ---------- generate placement ----------
  var backBaseX = [322, 372, 428, 474];
  var frontBaseX = [292, 344, 399, 452, 506];

  var configs = [];
  backBaseX.forEach(function (bx) {
    var x = bx + rand(-10, 10);
    configs.push({
      row: "back", rowGroup: backRow,
      x: x, y: groundY(x),
      scale: rand(0.78, 0.90), H: rand(130, 155),
      greens: BACK_GREENS
    });
  });
  frontBaseX.forEach(function (bx) {
    var x = bx + rand(-12, 12);
    configs.push({
      row: "front", rowGroup: frontRow,
      x: x, y: groundY(x) + 3,
      scale: rand(0.95, 1.12), H: rand(155, 185),
      greens: FRONT_GREENS
    });
  });

  var hueIdx = assignHues(configs.map(function (c) { return { row: c.row, x: c.x }; }));
  configs.forEach(function (c, i) {
    var h = hueIdx ? hueIdx[i] : Math.floor(Math.random() * palette.length);
    var base = palette[h];
    c.color = c.row === "back" ? dimColor(base) : base;
  });

  // shuffled drop order so it doesn't read left-to-right
  var order = configs.map(function (_, i) { return i; });
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  configs.forEach(function (c, i) { c.dropIndex = order[i]; });

  // ---------- build DOM + choreograph ----------
  var hand = reduced ? null : buildHand(handGroup);
  var maxDropDelay = 0;

  configs.forEach(function (spec) {
    var t = buildTulip(spec, spec.rowGroup);

    if (reduced) {
      // render finished state directly, no motion
      t.shadow.style.opacity = "0.6";
      t.seedG.style.display = "none";
      t.stem.style.strokeDasharray = String(t.L);
      t.stem.style.strokeDashoffset = "0";
      t.stemHi.style.strokeDasharray = String(t.L);
      t.stemHi.style.strokeDashoffset = "0";
      [t.leafA, t.leafB].filter(Boolean).forEach(function (a) {
        a.style.opacity = "1";
        a.style.transform = "scale(1)";
      });
      t.headBloom.style.opacity = "1";
      t.headBloom.style.transform = "scale(1,1)";
      t.headFront.style.opacity = "1";
      return;
    }

    var dropIndex = spec.dropIndex;
    var dropDelay = dropIndex * 140 + rand(0, 180) + 1100; // +1100ms: wait for the hand to arrive
    if (dropDelay > maxDropDelay) maxDropDelay = dropDelay;
    var dropDuration = 850 + rand(0, 100);
    var landTime = dropDelay + dropDuration * 0.62;
    var stemStart = landTime + 500;
    var stemDuration = 4200;
    var leafAStart = stemStart + 1400;
    var leafBStart = stemStart + 2200;
    var leafDuration = 1600;
    var bloomStart = stemStart + 3200;
    var bloomDuration = 2600;
    var bloomEnd = bloomStart + bloomDuration;

    // 1. SEED DROP (originates at the hand's fingertip, scene (400,150))
    var sx = (400 - spec.x) / spec.scale;
    var sy = (150 - spec.y) / spec.scale;
    var r = rand(-25, 25);
    var bx1 = rand(2, 7);
    var bx2 = rand(2, 7);
    t.seedG.style.transform = "translate(" + sx + "px," + sy + "px) rotate(0deg)";
    var dropKF = [
      { transform: "translate(" + sx + "px," + sy + "px) rotate(0deg)", offset: 0, easing: "cubic-bezier(.5,0,.9,.35)" },
      { transform: "translate(0px,0px) rotate(" + r + "deg)", offset: 0.62, easing: "cubic-bezier(.2,.6,.4,1)" },
      { transform: "translate(" + bx1 + "px,-14px) rotate(" + (r + 8) + "deg)", offset: 0.76, easing: "cubic-bezier(.5,0,.9,.35)" },
      { transform: "translate(" + bx2 + "px,0px) rotate(" + (r + 12) + "deg)", offset: 0.87, easing: "cubic-bezier(.2,.6,.4,1)" },
      { transform: "translate(" + bx2 + "px,-4.5px) rotate(" + (r + 14) + "deg)", offset: 0.94, easing: "cubic-bezier(.5,0,.9,.35)" },
      { transform: "translate(" + bx2 + "px,0px) rotate(" + (r + 15) + "deg)", offset: 1 }
    ];
    t.seedG.animate(dropKF, { duration: dropDuration, delay: dropDelay, fill: "forwards" });

    // tiny recoil flick of the hand at the moment this seed is released
    if (hand) {
      hand.idle.animate([
        { transform: "rotate(0deg)", offset: 0 },
        { transform: "rotate(3deg)", offset: 0.4 },
        { transform: "rotate(0deg)", offset: 1 }
      ], { duration: 220, delay: dropDelay, fill: "none" });
    }

    // 2. IMPACT PUFF
    for (var pi = 0; pi < 3; pi++) {
      (function () {
        var dx = rand(-14, 14);
        var dy = rand(-16, -6);
        var dot = el("circle", { cx: "0", cy: "0", r: String(rand(2, 3.5)), fill: "#2A4A32" });
        dot.style.opacity = "0";
        t.puffG.appendChild(dot);
        var anim = dot.animate([
          { transform: "translate(0px,0px) scale(0.6)", opacity: 0.85, offset: 0 },
          { transform: "translate(" + dx + "px," + dy + "px) scale(1.3)", opacity: 0, offset: 1 }
        ], { duration: 450, delay: landTime, easing: "ease-out", fill: "forwards" });
        anim.onfinish = function () { if (dot.parentNode) dot.parentNode.removeChild(dot); };
      })();
    }

    // 3. SEED SINKS
    t.seedG.animate([
      { transform: "translate(" + bx2 + "px,0px) rotate(" + (r + 15) + "deg) scale(1)", opacity: 1, offset: 0 },
      { transform: "translate(" + bx2 + "px,4px) rotate(" + (r + 15) + "deg) scale(0.6)", opacity: 0, offset: 1 }
    ], { duration: 320, delay: landTime + 260, easing: "ease-in", fill: "forwards" });

    // CONTACT SHADOW fades in as the stem starts growing
    t.shadow.animate([
      { opacity: 0 },
      { opacity: 0.6 }
    ], { duration: 600, delay: stemStart, easing: "ease-out", fill: "forwards" });

    // 4. STEM GROWS (highlight rides in lockstep with the main stem)
    t.stem.style.strokeDasharray = String(t.L);
    t.stem.style.strokeDashoffset = String(t.L);
    t.stemHi.style.strokeDasharray = String(t.L);
    t.stemHi.style.strokeDashoffset = String(t.L);
    var stemGrowKF = [
      { strokeDashoffset: String(t.L) },
      { strokeDashoffset: "0" }
    ];
    var stemGrowOpts = { duration: stemDuration, delay: stemStart, easing: "cubic-bezier(.16,.72,.30,1)", fill: "forwards" };
    t.stem.animate(stemGrowKF, stemGrowOpts);
    t.stemHi.animate(stemGrowKF, stemGrowOpts);

    // 5. LEAVES UNFURL
    var leafPairs = [[t.leafA, leafAStart]];
    if (t.leafB) leafPairs.push([t.leafB, leafBStart]);
    leafPairs.forEach(function (pair) {
      var leaf = pair[0], start = pair[1];
      leaf.animate([
        { transform: "scale(0.05)", opacity: 0, offset: 0 },
        { opacity: 1, offset: 0.25 },
        { transform: "scale(1)", opacity: 1, offset: 1 }
      ], { duration: leafDuration, delay: start, easing: "cubic-bezier(.34,1.32,.42,1)", fill: "forwards" });
    });

    // 6. BUD FORMS THEN SWELLS OPEN (single silhouette, petals carved in)
    t.headBloom.animate([
      { transform: "scale(0.30,0.42)", opacity: 0, offset: 0, easing: "ease-out" },
      { transform: "scale(0.42,0.72)", opacity: 1, offset: 0.45, easing: "cubic-bezier(.3,1.22,.45,1)" },
      { transform: "scale(1,1)", opacity: 1, offset: 1 }
    ], { duration: bloomDuration, delay: bloomStart, fill: "forwards" });

    // front petal reveal over the last 45% of the bloom
    var detailDelay = bloomStart + bloomDuration * 0.55;
    var detailDuration = bloomDuration * 0.45;
    var detailKF = [{ opacity: 0 }, { opacity: 1 }];
    var detailOpts = { duration: detailDuration, delay: detailDelay, easing: "ease-out", fill: "forwards" };
    t.headFront.animate(detailKF, detailOpts);

    // 7. SWAY (infinite, starts after bloom ends)
    var swayA = -(1.0 + rand(0, 1.3));
    var swayB = (1.2 + rand(0, 1.4));
    var swayDur = rand(3.4, 5.2);
    t.swayEl.style.setProperty("--sa", swayA + "deg");
    t.swayEl.style.setProperty("--sb", swayB + "deg");
    t.swayEl.style.animationName = "tulip-sway";
    t.swayEl.style.animationDuration = swayDur + "s";
    t.swayEl.style.animationDelay = bloomEnd + "ms";
    t.swayEl.style.animationTimingFunction = "ease-in-out";
    t.swayEl.style.animationIterationCount = "infinite";

    var hsA = -rand(0.2, 0.8);
    var hsB = rand(0.2, 0.8);
    var hsDur = swayDur * 1.18;
    t.headSwayEl.style.setProperty("--sa", hsA + "deg");
    t.headSwayEl.style.setProperty("--sb", hsB + "deg");
    t.headSwayEl.style.animationName = "tulip-sway";
    t.headSwayEl.style.animationDuration = hsDur + "s";
    t.headSwayEl.style.animationDelay = bloomEnd + "ms";
    t.headSwayEl.style.animationTimingFunction = "ease-in-out";
    t.headSwayEl.style.animationIterationCount = "infinite";
  });

  // hand exit: after the last seed has left the fingertip (+ its recoil settles), withdraw and remove
  if (hand) {
    var handExitStart = maxDropDelay + 220 + 200;
    var handExit = hand.motion.animate([
      { transform: "translateY(0px)" },
      { transform: "translateY(-320px)" }
    ], { duration: 900, delay: handExitStart, easing: "cubic-bezier(.5,0,.9,.35)", fill: "forwards" });
    handExit.onfinish = function () {
      if (handGroup.parentNode) handGroup.parentNode.removeChild(handGroup);
    };
  }

  // ---------- pollen motes ----------
  var POLLEN_N = 10;
  for (var pn = 0; pn < POLLEN_N; pn++) {
    var cx = 400 + rand(-150, 150);
    var cy = 195 + rand(-100, 95);
    var op = rand(0.35, 0.70);
    var mote = el("circle", {
      cx: String(cx), cy: String(cy), r: String(rand(1.4, 2.8)),
      fill: "#FFE9A8", "class": "pollen"
    });
    pollenGroup.appendChild(mote);

    if (reduced) {
      mote.style.opacity = String(op);
      continue;
    }

    var fadeDelay = 4500 + rand(0, 800);
    mote.animate([
      { opacity: 0 },
      { opacity: op }
    ], { duration: 1200, delay: fadeDelay, easing: "ease-out", fill: "forwards" });

    var dx = rand(-6, 6);
    var dy = rand(-7, 7);
    var dur = rand(6, 11);
    var driftDelay = fadeDelay + rand(0, 1200);
    mote.style.setProperty("--dx", dx + "px");
    mote.style.setProperty("--dy", dy + "px");
    mote.style.animationName = "pollen-drift";
    mote.style.animationDuration = dur + "s";
    mote.style.animationDelay = driftDelay + "ms";
    mote.style.animationTimingFunction = "ease-in-out";
    mote.style.animationIterationCount = "infinite";
    mote.style.animationDirection = "alternate";
  }

  // ---------- grain overlay (last element, above everything) ----------
  var grainDefs = el("defs", {});
  var grainFilter = el("filter", { id: "grain", x: "0", y: "0", width: "100%", height: "100%" });
  grainFilter.appendChild(el("feTurbulence", { type: "fractalNoise", baseFrequency: "0.9", numOctaves: "3", stitchTiles: "stitch" }));
  grainFilter.appendChild(el("feColorMatrix", { type: "saturate", values: "0" }));
  grainDefs.appendChild(grainFilter);
  scene.appendChild(grainDefs);
  var grainRect = el("rect", {
    x: "0", y: "0", width: "800", height: "520",
    filter: "url(#grain)", opacity: "0.05",
    style: "mix-blend-mode:normal", "pointer-events": "none"
  });
  scene.appendChild(grainRect);
})();
</script>
</body>
</html>
