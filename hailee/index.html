<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hailee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @font-face {
    font-family: 'Newsreader';
    src: url('../assets/fonts/newsreader-latin-opsz-italic.woff2') format('woff2');
    font-style: italic;
    font-weight: 300 500;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #030302;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Newsreader', Georgia, serif;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* faint uneven ground shadow so the flowers don't float in a void */
  .ground {
    fill: #060a05;
  }

  .tulip-sway {
    transform-origin: 0px 0px;
    animation-name: sway;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  @keyframes sway {
    from { transform: rotate(var(--sway-a)); }
    to   { transform: rotate(var(--sway-b)); }
  }

  .stem {
    fill: none;
    stroke: #2c4a22;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-dasharray: 1px;
    stroke-dashoffset: 1px;
    animation: grow 1.75s cubic-bezier(.22,.68,.32,1) forwards;
    animation-delay: var(--d0);
  }

  @keyframes grow {
    to { stroke-dashoffset: 0px; }
  }

  .leaf {
    fill: #33531f;
    opacity: 0;
    transform: scale(0.15) rotate(var(--leaf-rot, 0deg));
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: unfurl 1s cubic-bezier(.34,1.42,.4,1) forwards;
  }

  .leaf-a { animation-delay: calc(var(--d0) + 0.55s); }
  .leaf-b { animation-delay: calc(var(--d0) + 0.85s); }

  @keyframes unfurl {
    to { opacity: 1; transform: scale(1) rotate(var(--leaf-rot, 0deg)); }
  }

  .bud {
    opacity: 0;
    transform: scale(0.2);
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: budin 0.6s ease-out forwards;
    animation-delay: calc(var(--d0) + 1.35s);
  }

  @keyframes budin {
    to { opacity: 1; transform: scale(1); }
  }

  .petals {
    opacity: 0;
    animation: fadeout-bud 0.01s linear forwards;
    animation-delay: calc(var(--d0) + 1.95s);
  }

  @keyframes fadeout-bud { to { opacity: 1; } }

  .flower .bud {
    animation: budin 0.6s ease-out forwards, budout 0.01s linear forwards;
    animation-delay: calc(var(--d0) + 1.35s), calc(var(--d0) + 1.95s);
  }

  @keyframes budout { to { opacity: 0; } }

  .petal {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: scale(0.25);
    opacity: 0;
    animation: bloom 1.05s cubic-bezier(.3,1.4,.45,1) forwards;
  }

  .petal-l { animation-delay: calc(var(--d0) + 1.95s); }
  .petal-c { animation-delay: calc(var(--d0) + 2.05s); }
  .petal-r { animation-delay: calc(var(--d0) + 2.0s); }

  @keyframes bloom {
    to { transform: scale(1); opacity: 1; }
  }

  .caption {
    position: fixed;
    bottom: 6.5%;
    left: 0;
    right: 0;
    text-align: center;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    letter-spacing: 0.02em;
    color: #cfc6b3;
    opacity: 0;
    animation: caption-in 2.4s ease-out forwards;
    animation-delay: 3.4s;
    pointer-events: none;
    user-select: none;
  }

  @keyframes caption-in {
    to { opacity: 0.75; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stem, .leaf, .bud, .petal, .caption { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    .tulip-sway { animation: none; }
  }
</style>
</head>
<body>

<svg id="scene" preserveAspectRatio="xMidYMax slice"></svg>
<div class="caption">for hailee</div>

<script>
(function () {
  var svgNS = "http://www.w3.org/2000/svg";
  var scene = document.getElementById("scene");

  var W = window.innerWidth;
  var H = window.innerHeight;
  scene.setAttribute("viewBox", "0 0 " + W + " " + H);

  // faint uneven ground line, drawn once as a soft irregular ribbon
  var groundY = H - 34;
  var gpath = "M0," + (groundY + 10);
  var x = 0;
  while (x < W) {
    var step = 60 + Math.random() * 70;
    var dy = (Math.random() - 0.5) * 14;
    x += step;
    gpath += " Q " + (x - step / 2) + "," + (groundY + dy) + " " + x + "," + (groundY + (Math.random() - 0.5) * 10);
  }
  gpath += " L " + W + "," + H + " L 0," + H + " Z";
  var ground = document.createElementNS(svgNS, "path");
  ground.setAttribute("d", gpath);
  ground.setAttribute("class", "ground");
  scene.appendChild(ground);

  // seeded-ish random so the field feels planted, not procedurally uniform
  function rand(a, b) { return a + Math.random() * (b - a); }

  var palette = ["#c0293c", "#d94f7c", "#e2664b", "#8b5a9e", "#e0a72e", "#a12f4f"];

  function shade(hex, factor) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.round(r * factor); g = Math.round(g * factor); b = Math.round(b * factor);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function buildTulip(x, y, scale, color, delay, swayDur, swaySkew) {
    var g = document.createElementNS(svgNS, "g");
    g.setAttribute("transform", "translate(" + x + "," + y + ") scale(" + scale + ")");

    var sway = document.createElementNS(svgNS, "g");
    sway.setAttribute("class", "tulip-sway");
    sway.style.setProperty("--sway-a", (-1.2 - swaySkew) + "deg");
    sway.style.setProperty("--sway-b", (1.6 + swaySkew) + "deg");
    sway.style.animationDuration = swayDur + "s";
    sway.style.animationDelay = (delay + 2.6) + "s";

    var stemWobble = rand(-10, 10);
    var stemPath = "M0,0 C " + (stemWobble * 0.4) + ",-40 " + (-stemWobble * 0.6) + ",-85 " +
                    (stemWobble * 0.3) + ",-125 C " + (stemWobble * 0.1) + ",-142 " + (-stemWobble * 0.2) + ",-148 0,-152";

    var stem = document.createElementNS(svgNS, "path");
    stem.setAttribute("d", stemPath);
    stem.setAttribute("class", "stem");
    stem.setAttribute("pathLength", "1");
    stem.style.setProperty("--d0", delay + "s");
    sway.appendChild(stem);

    function leaf(y, dir, cls, rot) {
      var l = document.createElementNS(svgNS, "path");
      var sx = dir;
      var d = "M0,0 C " + (18 * sx) + ",-8 " + (30 * sx) + ",-32 " + (14 * sx) + ",-62 " +
              "C " + (6 * sx) + ",-40 " + (2 * sx) + ",-18 0,0 Z";
      l.setAttribute("d", d);
      l.setAttribute("transform", "translate(0," + y + ")");
      l.setAttribute("class", "leaf " + cls);
      l.style.setProperty("--d0", delay + "s");
      l.style.setProperty("--leaf-rot", rot + "deg");
      sway.appendChild(l);
    }
    leaf(-38, 1, "leaf-a", rand(-6, 2));
    leaf(-78, -1, "leaf-b", rand(-2, 6));

    var flower = document.createElementNS(svgNS, "g");
    flower.setAttribute("class", "flower");
    flower.setAttribute("transform", "translate(0,-152)");

    var bud = document.createElementNS(svgNS, "path");
    bud.setAttribute("d", "M0,0 C -9,-6 -10,-24 0,-36 C 10,-24 9,-6 0,0 Z");
    bud.setAttribute("fill", shade(color, 0.72));
    bud.setAttribute("class", "bud");
    bud.style.setProperty("--d0", delay + "s");
    flower.appendChild(bud);

    var petals = document.createElementNS(svgNS, "g");
    petals.setAttribute("class", "petals");

    function petal(rotDeg, cls, w, len) {
      var p = document.createElementNS(svgNS, "g");
      p.setAttribute("transform", "rotate(" + rotDeg + ")");
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", "M0,0 C -" + w + ",-" + (len * 0.4) + " -" + (w * 0.7) + ",-" + (len * 0.85) + " 0,-" + len +
                         " C " + (w * 0.7) + ",-" + (len * 0.85) + " " + w + ",-" + (len * 0.4) + " 0,0 Z");
      path.setAttribute("fill", color);
      path.setAttribute("class", "petal " + cls);
      path.style.setProperty("--d0", delay + "s");
      p.appendChild(path);
      petals.appendChild(p);
    }
    petal(-27, "petal-l", 11, 40);
    petal(0, "petal-c", 12, 46);
    petal(27, "petal-r", 11, 40);

    flower.appendChild(petals);
    sway.appendChild(flower);
    g.appendChild(sway);
    scene.appendChild(g);
  }

  var count = Math.max(7, Math.round(W / 130));
  var margin = W * 0.06;
  var slots = [];
  for (var i = 0; i < count; i++) {
    slots.push(margin + (i + 0.5) * ((W - margin * 2) / count));
  }

  var lastColor = -1;
  slots.forEach(function (baseX, i) {
    var x = baseX + rand(-34, 34);
    var y = groundY + rand(-4, 12);
    var scale = rand(0.68, 1.18);
    var colorIdx = Math.floor(Math.random() * palette.length);
    if (colorIdx === lastColor) colorIdx = (colorIdx + 1) % palette.length;
    lastColor = colorIdx;
    var delay = rand(0, 1.1) + i * 0.12;
    var swayDur = rand(3.6, 5.4);
    var swaySkew = rand(0, 1.2);
    buildTulip(x, y, scale, palette[colorIdx], delay, swayDur, swaySkew);
  });

  window.addEventListener("resize", function () {
    location.reload();
  });
})();
</script>
</body>
</html>
